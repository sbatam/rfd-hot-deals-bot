name: RFD Hot Deals to Telegram

on:
  # Main trigger: cron-job.org calls workflow_dispatch every 5 minutes.
  workflow_dispatch:
    inputs:
      test_post:
        description: "Also post the newest deal once, to check the channel works"
        type: boolean
        default: false
  # Backup only. GitHub's own timer is unreliable and often skips runs.
  # Offset minutes avoid the busiest times (:00, :05, :10 ...).
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

# Only one run at a time, so the saved list of posted deals never gets mixed up.
concurrency:
  group: rfd-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers which threads were already posted between runs
      - name: Restore seen threads
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: rfd-state-${{ github.run_id }}
          restore-keys: rfd-state-

      - name: Check RFD and post new deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_post }}" = "true" ]; then python rfd_bot.py --test; fi
          python rfd_bot.py

      - name: Save seen threads
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: rfd-state-${{ github.run_id }}
